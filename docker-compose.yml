services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: docker
      DATABASE_URL: sqlite:////data/movie_booking.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-docker-secret-change-me}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    volumes:
      - movie_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  movie_data:
