name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check feature ownership
        if: github.event_name == 'pull_request'
        env:
          FEATURE_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_feature_scope.py --branch "$FEATURE_BRANCH" --base-ref "$BASE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test container
        run: |
          docker build -t movie-booking:test .
          docker run -d --name movie-booking-test -p 127.0.0.1:8000:8000 movie-booking:test
          trap 'docker logs movie-booking-test; docker rm -f movie-booking-test' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/health') as response:
                      assert response.status == 200
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Docker API did not become healthy')
          PY
          docker exec movie-booking-test python -m scripts.seed
          docker exec movie-booking-test python -m scripts.seed
